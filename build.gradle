plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// ソースは全てUTF-8（コメント・Javadocを日本語で書いているため必須）。
// 指定しないと javac はプラットフォーム既定のエンコーディングを使い、日本語版Windowsでは
// windows-31j(CP932) になってUTF-8の日本語コメントが「この文字(0x80)はマップできません」で
// コンパイルエラーになる。Gradleデーモンを起動した端末のロケール次第で成否が変わってしまうので、
// 環境に依存しないようここで固定する。
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// ============================================================
// 作者制作アセットの取り込み（syncGunAssets）
// ============================================================
// モデル/アニメーション/テクスチャ/サウンドは Blockbench 等の「作業フォルダ」で作り、
// このタスクが src/main/resources 配下の規約位置へコピーする。
// これにより、アセットを更新したら ./gradlew runClient を叩くだけでゲームに反映される
// （手作業のコピーも、コード側へのアニメーション登録も不要。登録側は GunModelCache が自動検出する）。
//
// 作業フォルダのパスはマシン固有なのでリポジトリには置かない。指定方法（上から優先）:
//   1. -Pcordite.assetDir=<path>
//   2. local.properties の cordite.assetDir=<path>（.gitignore 済み）
//   3. 環境変数 CORDITE_ASSET_DIR
// どれも無ければ同期はスキップする（clone しただけの環境でもビルドが通る）。
//
// コピー規則は「拡張子」と「effect フォルダに入っているか」だけで決まる。銃やアニメーションを
// 増やしてもこの build.gradle を編集する必要はない:
//   **/*.geo.json        → assets/<modid>/models/gun/
//   **/*.animation.json  → assets/<modid>/animations/gun/
//   **/*.ogg             → assets/<modid>/sounds/gun/
//   **/effect/*.png      → assets/<modid>/textures/effect/  （銃に依らない共有エフェクト）
//   **/reticle/*.png     → assets/<modid>/textures/reticle/ （レティクル）
//   **/*.png             → assets/<modid>/textures/gun/
// フォルダ階層は畳んでファイル名のみで配置する（作業フォルダ側の整理方法は自由）。
def nonEmptyProperty = { provider -> provider.map { it.trim() }.filter { !it.isEmpty() } }
def assetDirPath = nonEmptyProperty(providers.gradleProperty('cordite.assetDir'))
        .orElse(nonEmptyProperty(providers
                .fileContents(layout.projectDirectory.file('local.properties')).asText
                .map { text ->
                    def props = new Properties()
                    props.load(new StringReader(text))
                    props.getProperty('cordite.assetDir', '')
                }))
        .orElse(nonEmptyProperty(providers.environmentVariable('CORDITE_ASSET_DIR')))
// 設定時に確定させる（Copy の from は設定時に組み立てる必要があるため）。
def assetSourceDir = assetDirPath.isPresent() ? file(assetDirPath.get()) : null

var syncGunAssets = tasks.register('syncGunAssets', Copy) {
    group = 'cordite'
    description = '作者の作業フォルダからモデル/アニメ/テクスチャ/サウンドを resources へ同期する'
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    includeEmptyDirs = false
    into layout.projectDirectory.dir("src/main/resources/assets/${mod_id}")

    onlyIf {
        if (assetSourceDir == null) {
            logger.lifecycle('[Cordite] cordite.assetDir 未設定のためアセット同期をスキップ')
            return false
        }
        if (!assetSourceDir.isDirectory()) {
            logger.warn("[Cordite] アセット作業フォルダが見つからない: ${assetSourceDir}")
            return false
        }
        true
    }

    if (assetSourceDir != null) {
        // 作業フォルダ側のフォルダ階層は畳み、種別ごとの規約フォルダ＋ファイル名だけにする。
        // FileCopyDetails#relativePath はコピー先ルート基準なので、宛先フォルダもここで指定する
        // （子スペックの into と併用すると二重に付かず、into 側が無視される）。
        def flattenInto = { String... dir -> { details ->
            details.relativePath = new RelativePath(true, (dir.toList() + details.name) as String[])
        } }
        from(assetSourceDir) { include '**/*.geo.json'; eachFile flattenInto('models', 'gun') }
        from(assetSourceDir) { include '**/*.animation.json'; eachFile flattenInto('animations', 'gun') }
        from(assetSourceDir) { include '**/*.ogg'; eachFile flattenInto('sounds', 'gun') }
        from(assetSourceDir) { include '**/effect/*.png'; eachFile flattenInto('textures', 'effect') }
        from(assetSourceDir) { include '**/reticle/*.png'; eachFile flattenInto('textures', 'reticle') }
        from(assetSourceDir) {
            include '**/*.png'
            exclude '**/effect/*.png', '**/reticle/*.png'
            eachFile flattenInto('textures', 'gun')
        }
    }
}

// sounds.json のエントリ補完
// ------------------------------------------------------------
// 同期されてきた ogg に対応するエントリが sounds.json に無いと、アニメーションの sound_effects に
// 名前を書いても無音になる（SoundManagerが解決できない）。ogg を1つ足すたびに手で追記するのは
// 事故のもとなので、**足りないエントリだけ**を自動で書き足す。既存エントリ（subtitle等を手で足したもの）は
// 一切変更せず、消えた ogg のエントリも消さない（銃以外の音を手書きしている可能性があるため）。
var generateSoundsJson = tasks.register('generateSoundsJson') {
    group = 'cordite'
    description = 'sounds/gun/*.ogg に対応する sounds.json のエントリを補完する（既存エントリは変更しない）'
    mustRunAfter syncGunAssets

    def soundsDir = layout.projectDirectory.dir("src/main/resources/assets/${mod_id}/sounds/gun")
    def soundsJsonFile = layout.projectDirectory.file("src/main/resources/assets/${mod_id}/sounds.json")
    def modId = mod_id
    inputs.files(fileTree(soundsDir) { include '**/*.ogg' }).withPropertyName('oggFiles')
    outputs.file(soundsJsonFile)

    doLast {
        def jsonFile = soundsJsonFile.asFile
        def entries = new TreeMap()
        if (jsonFile.exists()) {
            entries.putAll(new groovy.json.JsonSlurper().parse(jsonFile))
        }

        def added = []
        soundsDir.asFile.listFiles()?.findAll { it.name.endsWith('.ogg') }?.sort { it.name }?.each { ogg ->
            def name = ogg.name[0..<(ogg.name.length() - 4)]
            if (!entries.containsKey(name)) {
                // subtitle は付けない（対応する lang エントリが無いとキー文字列がそのまま字幕に出るため）。
                // 字幕を出したい音は sounds.json と lang に手で足す。
                entries[name] = [category: 'player', sounds: [[name: "${modId}:gun/${name}".toString(), stream: false]]]
                added << name
            }
        }
        if (!added.isEmpty() || !jsonFile.exists()) {
            jsonFile.parentFile.mkdirs()
            jsonFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(entries)) + '\n'
            logger.lifecycle("[Cordite] sounds.json にエントリを追加: ${added}")
        }
    }
}

// ビルド/実行の前に必ず同期する（runClient も processResources を経由する）
tasks.named('processResources') { dependsOn syncGunAssets, generateSoundsJson }


dependencies {
    // Example mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${mc_version}-forge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
